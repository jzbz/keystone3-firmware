on:
  pull_request:
    paths:
      - rust/apps/decred/**
      - rust/rust_c/src/decred/**
      - rust/vendor/ur-registry/src/decred/**
      - rust/rust_c/src/common/ur.rs
      - rust/rust_c/src/common/ur_ext.rs
      # A dcr-rs bump within the manifest's semver range touches only the lockfile.
      - rust/Cargo.lock

name: Decred Checks

jobs:
  UnitTest:
    name: Unit Test And Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Read Rust toolchain
        run: echo "RUST_TOOLCHAIN=$(cat rust-toolchain)" >> $GITHUB_ENV

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Thresholds are the measured figures with a little headroom (measured:
      # regions 91.28, functions 92.31, lines 89.91), so an unrelated edit does not
      # trip them but a real drop in coverage does.
      - name: Run rust/apps/decred
        run: cd rust/apps/decred && cargo +$RUST_TOOLCHAIN llvm-cov --fail-under-regions 90 --fail-under-functions 91 --fail-under-lines 88 --ignore-filename-regex 'keystore/*|utils/*'

  # The rust_c Decred FFI test (dcr-sign-request UR round-trip) only builds under
  # a simulator feature set, since the device feature set has no host panic
  # handler. Unlike the Zcash equivalent this runs on Linux: the only host-specific
  # dependency the simulator drags in is the `screenshots` crate, which needs xcb
  # development headers rather than macOS. Verified to compile and pass on Linux.
  RustCDecredTest:
    name: rust_c Decred FFI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install xcb headers for the simulator's screen-capture dependency
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev

      - name: Read Rust toolchain
        run: echo "RUST_TOOLCHAIN=$(cat rust-toolchain)" >> $GITHUB_ENV

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true

      - name: Run rust_c decred tests
        run: cd rust && cargo +$RUST_TOOLCHAIN test -p rust_c --no-default-features --features simulator-multi-coins --lib -- decred common::ur

  # Every line that can lose funds -- BLAKE-256, addresses, BIP32, the wire
  # format, the sighash, signing, and the whole air-gap package -- lives in dcr-rs,
  # which comes from crates.io at the version and checksum rust/Cargo.lock records.
  # Bumping it can touch nothing but the lockfile, so on its own nothing in this
  # repository would notice a release whose own suite does not pass. Run dcr-rs's
  # suite on exactly the crate this firmware locks -- the published .crate, checked
  # against the lockfile checksum -- so a bump cannot slip past the consensus tests.
  PinnedDcrRs:
    name: dcr-rs at the locked version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Read the locked dcr-rs version and checksum
        run: |
          if [ "$(grep -c '^name = "dcr-rs"$' rust/Cargo.lock)" != 1 ]; then
            echo "rust/Cargo.lock must lock exactly one dcr-rs" >&2
            exit 1
          fi
          ENTRY=$(awk '/^\[\[package\]\]$/ { p = 0 } /^name = "dcr-rs"$/ { p = 1 } p' rust/Cargo.lock)
          VERSION=$(printf '%s\n' "$ENTRY" | sed -n 's/^version = "\(.*\)"$/\1/p')
          SOURCE=$(printf '%s\n' "$ENTRY" | sed -n 's/^source = "\(.*\)"$/\1/p')
          CHECKSUM=$(printf '%s\n' "$ENTRY" | sed -n 's/^checksum = "\([0-9a-f]\{64\}\)"$/\1/p')
          if [ "$SOURCE" != "registry+https://github.com/rust-lang/crates.io-index" ] || [ -z "$VERSION" ] || [ -z "$CHECKSUM" ]; then
            echo "rust/Cargo.lock does not lock dcr-rs from crates.io with a checksum" >&2
            exit 1
          fi
          echo "DCR_RS_VERSION=$VERSION" >> $GITHUB_ENV
          echo "DCR_RS_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "locked dcr-rs: $VERSION ($CHECKSUM)"

      - name: Download the locked crate and check it against the lockfile
        run: |
          curl -fsSL -o dcr-rs.crate "https://static.crates.io/crates/dcr-rs/dcr-rs-$DCR_RS_VERSION.crate"
          echo "$DCR_RS_CHECKSUM  dcr-rs.crate" | sha256sum -c -
          tar -xzf dcr-rs.crate

      - uses: dtolnay/rust-toolchain@stable

      - name: Run the dcr-rs suite
        run: cd "dcr-rs-$DCR_RS_VERSION" && cargo test --all-features --locked
